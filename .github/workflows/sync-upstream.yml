name: Sync with fredemmott

# Run by hand when fredemmott publishes a release. Merges his fe-5.1 into
# main, then builds the result, as a push made with this workflow's token
# doesn't start the build by itself. Two conflicts are expected and resolved
# here. One is in res/config.zip whenever upstream regenerates it, resolved by
# taking upstream's zip and appending this fork's profiles again. The other is
# in app.py whenever upstream changes its version, resolved by taking upstream's
# file, which assumes the version is this fork's only change to that file. Any
# other conflict fails the run for a person to resolve.
#
# This fork counts its own releases: every merge sets the version to upstream's
# base version, VERSION_LABEL, and one more than this fork's last count, so
# 5.1+jb.5 merging upstream's 5.1+fredemmott.5 becomes 5.1+jb.6.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORK_PROFILES: >-
    fc_DMG_ChisFlash-MBC5-MAX_28EW256A.txt
    fc_DMG_ChisFlash-MBC5-MAX_S29GL256N.txt
    fc_DMG_S29JL032J_TOP.txt
  VERSION_LABEL: jb

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.merge.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch fredemmott's fe-5.1
        run: |
          git config user.name 'Justin Beeson'
          git config user.email '41129295+thisjustin816@users.noreply.github.com'
          git remote add upstream https://github.com/fredemmott/FlashGBX.git
          git fetch --no-tags upstream fe-5.1

      - name: Merge it into main
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/fe-5.1 HEAD; then
            echo 'main already contains fredemmott/fe-5.1'
            exit 0
          fi
          count="$(sed -nE "s/^[[:space:]]*VERSION_PEP440 = \"[^+\"]+\+${VERSION_LABEL}\.([0-9]+)\".*/\1/p" FlashGBX/app.py)"
          if [ -z "$count" ]; then
            echo "::error::FlashGBX/app.py's version doesn't end in +${VERSION_LABEL}.N"
            exit 1
          fi
          if ! git merge --no-ff --no-commit upstream/fe-5.1; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            unexpected="$(echo "$conflicted" | grep -vx -e 'FlashGBX/res/config.zip' -e 'FlashGBX/app.py' || true)"
            if [ -n "$unexpected" ]; then
              echo "::error::Merge conflicts need resolving by hand: $unexpected"
              git merge --abort
              exit 1
            fi
            if echo "$conflicted" | grep -qx 'FlashGBX/res/config.zip'; then
              git checkout --theirs FlashGBX/res/config.zip
              python3 - <<'PY'
          import os, zipfile
          path = "FlashGBX/res/config.zip"
          with zipfile.ZipFile(path) as z:
              present = set(z.namelist())
          with zipfile.ZipFile(path, "a", compression=zipfile.ZIP_DEFLATED) as z:
              for name in os.environ["FORK_PROFILES"].split():
                  if name not in present:
                      z.write(os.path.join("FlashGBX/config", name), name)
          PY
              git add FlashGBX/res/config.zip
            fi
            if echo "$conflicted" | grep -qx 'FlashGBX/app.py'; then
              git checkout --theirs FlashGBX/app.py
            fi
          fi
          version="$(sed -nE 's/^[[:space:]]*VERSION_PEP440 = "([^+"]+).*/\1/p' FlashGBX/app.py)+${VERSION_LABEL}.$((count + 1))"
          sed -i -E "s/^([[:space:]]*VERSION_PEP440 = \")[^\"]+\"/\1${version}\"/" FlashGBX/app.py
          if ! grep -qF "VERSION_PEP440 = \"${version}\"" FlashGBX/app.py; then
            echo "::error::Couldn't set the version in FlashGBX/app.py to $version"
            git merge --abort
            exit 1
          fi
          git add FlashGBX/app.py
          git commit --no-edit
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.commit != ''
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: ${{ needs.sync.outputs.commit }}
