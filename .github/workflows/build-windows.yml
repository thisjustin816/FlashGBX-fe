name: Build Windows installer

# Runs fredemmott's release script unsigned, with the two Chromatic drivers his
# installer ships: the Gowin cable driver out of ChromaticFirmwareUpdater, and
# the signed cartridge IO driver catalog out of his release CARTIO_CATALOG_FROM.
# That driver is configuration only and isn't expected to change, so one release
# serves every build here. fetch-drivers.ps1 fails the build if the .inf it covers
# stops matching this repository's.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true

permissions:
  contents: read

env:
  CARTIO_CATALOG_FROM: 5.1+fredemmott.4

jobs:
  build:
    runs-on: windows-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
          }

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path FlashGBX/app.py -Pattern 'VERSION_PEP440 = "(.+)"'
          $release = $match.Matches[0].Groups[1].Value
          $commit = git rev-parse --short HEAD
          "release=$release" >> $env:GITHUB_OUTPUT
          "value=$release-$commit" >> $env:GITHUB_OUTPUT

      - name: Fetch the Chromatic drivers
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./release-scripts/fetch-drivers.ps1 -Version '${{ env.CARTIO_CATALOG_FROM }}' -Destination drivers

      - name: Build
        shell: pwsh
        run: |
          # Run it as it runs by hand, where an error doesn't stop it
          $ErrorActionPreference = 'Continue'
          ./release-scripts/win32.ps1 -Version '${{ steps.version.outputs.value }}' -NoSign `
            -GowinDriver 'drivers/GowinUSBCableDriverV5_for_win7+.exe' `
            -CartIOCatalog drivers/chromatic_cartio.cat
          if (-not (Test-Path 'setup/FlashGBX-${{ steps.version.outputs.value }}_Windows-x64_Setup.exe')) {
            Write-Error 'The installer was not built'
            exit 1
          }

      - name: Check packaged Python and Chromatic backend
        shell: pwsh
        run: |
          & ./cache/embedded-python/python.exe -X utf8 -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Host tests failed' }
          & ./cache/embedded-python/python.exe -X utf8 -c "from FlashGBX.hw_Chromatic import GbxDevice; device = GbxDevice(); assert device.GetSupportedModes() == ['DMG']"
          if ($LASTEXITCODE -ne 0) { throw 'Chromatic backend import failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: FlashGBX-${{ steps.version.outputs.value }}-Windows
          path: |
            artifacts/*.zip
            artifacts/*.pdb
            setup/*_Setup.exe
          if-no-files-found: error

  # Publishes a release the first time a version is built, and tags the commit
  # that was built. A later build of the same version leaves the release alone.
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.release }}
    steps:
      - name: Check for an existing release
        id: existing
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released"
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.found != 'true'
        with:
          pattern: FlashGBX-*-Windows
          path: release-files
          merge-multiple: true

      - name: Publish the release
        if: steps.existing.outputs.found != 'true'
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target '${{ inputs.ref || github.sha }}' \
            --title "FlashGBX ${TAG#v}" \
            --generate-notes \
            $(find release-files -type f)
